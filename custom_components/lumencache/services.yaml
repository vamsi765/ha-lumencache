set_light:
  target:
    entity:
      integration: lumencache
      domain: light
  fields:
    brightness_pct:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
          mode: box
    color_temp_kelvin:
      selector:
        number:
          min: 1000
          max: 20000
          unit_of_measurement: K
          mode: box
    transition:
      selector:
        number:
          min: 0
          max: 6553
          step: 0.1
          unit_of_measurement: s
          mode: box

send_raw:
  fields:
    command:
      required: true
      example: '{"e": 57, "g": 14, "bri": 50, "fade": 800}'
      selector:
        object:
    system:
      selector:
        config_entry:
          integration: lumencache
